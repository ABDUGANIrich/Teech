name: Verify Teech
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 1"
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: teech_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d teech_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:postgres
        env:
          TEST_DATABASE_URL: postgresql://postgres:local-test-only@127.0.0.1:5432/teech_test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
      - run: npm run test:e2e:full
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results/
